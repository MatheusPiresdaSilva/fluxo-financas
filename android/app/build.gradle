plugins {
    id 'com.android.application'
}

// A assinatura vem dos secrets do GitHub Actions (veja .github/workflows/android.yml)
def keystoreFile = System.getenv("KEYSTORE_FILE")

android {
    namespace 'com.matheuspires.fluxo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.matheuspires.fluxo'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0"
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
