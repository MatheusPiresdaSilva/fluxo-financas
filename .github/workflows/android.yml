name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Copiar o app web para dentro do APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html style.css app.js icon.svg manifest.webmanifest vendor android/app/src/main/assets/www/

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fluxo.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/fluxo.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem KEYSTORE_BASE64: o APK será assinado com a chave de debug"
          fi

      - name: Compilar o APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: fluxo
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Fluxo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fluxo-apk
          path: Fluxo.apk

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" Fluxo.apk \
            --title "Fluxo $TAG" \
            --notes "📱 Baixe o **Fluxo.apk** abaixo e abra no celular Android para instalar. Se o Android pedir, permita instalar apps desta fonte." \
            --latest
